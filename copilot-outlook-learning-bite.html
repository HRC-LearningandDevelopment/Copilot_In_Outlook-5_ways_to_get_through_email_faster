  /* ====== HRC palette and type ====== */
  :root{
    --paper:#F2F5F8;
    --ink:#1B1A23;
    --ink-soft:#5A696B;
    --night:#243748;
    --deep:#124163;
    --blue:#2683C6;
    --ocean:#3394BA;
    --teal:#57B6C0;
    --sea:#76BDA7;
    --mist:#CDDBE6;
    --accent:#2683C6;
    --accent-tint:#E5EEF0;
    --mint:#E3F1ED;
    --line:#CDDBE6;
    --grad:linear-gradient(120deg,#2683C6 0%,#3394BA 45%,#57B6C0 80%,#76BDA7 100%);
    --display:"HRC Proxima","Proxima Nova","Segoe UI",system-ui,sans-serif;
    --body:"HRC Proxima","Proxima Nova","Segoe UI",system-ui,sans-serif;
    /* Outlook look (keep as is for realism) */
    --ol-bg:#F0F0F0;
    --ol-blue:#0F6CBD;
    --ol-text:#242424;
    --ol-sub:#616161;
    --ol-line:#D1D1D1;
    --ol-ui:"Segoe UI", "Aptos", system-ui, -apple-system, sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:linear-gradient(160deg,#E5EEF0 0%,#CDDBE6 100%);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;display:flex;align-items:center;justify-content:center;padding:24px}
  button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
  button:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}

  .player{width:min(1240px,100%);background:#fff;border-radius:18px;box-shadow:0 40px 80px -40px rgba(14,22,28,.55);overflow:hidden;display:flex;flex-direction:column}
  .top{display:flex;justify-content:space-between;align-items:center;padding:14px 26px;background:linear-gradient(90deg,#1B1A23 0%,#243748 100%);font-size:14px;color:#84ACB6;letter-spacing:.01em}
  .brand{display:flex;align-items:center;gap:12px;font-weight:600;color:#fff}
  .brand-mark{width:34px;height:34px;border-radius:9px;background:linear-gradient(145deg,#2683C6 0%,#3394BA 45%,#57B6C0 80%,#76BDA7 100%);display:grid;place-items:center;box-shadow:0 6px 16px -6px rgba(87,182,192,.75),inset 0 1px 0 rgba(255,255,255,.35)}
  .brand .div{width:1px;height:16px;background:rgba(205,219,230,.3)}
  .brand .prog{font-weight:400;color:#CDDBE6}

  .stage{position:relative;aspect-ratio:16/8.4;min-height:460px;background:radial-gradient(900px 420px at 88% 10%,#E5EEF0 0%,rgba(229,238,240,0) 70%),linear-gradient(180deg,#FFFFFF 0%,#F2F5F8 100%)}
  .scene{position:absolute;inset:0;display:grid;grid-template-columns:minmax(230px,.62fr) 1.7fr;gap:32px;padding:30px 34px;align-items:center}
  .scene.full{display:flex;flex-direction:column;justify-content:center;align-items:flex-start;padding:28px 48px}
  .scene.dark{color:#fff;background:radial-gradient(760px 460px at 86% 12%,rgba(87,182,192,.32),rgba(87,182,192,0) 65%),radial-gradient(700px 520px at 8% 105%,rgba(38,131,198,.42),rgba(38,131,198,0) 62%),linear-gradient(135deg,#1B1A23 0%,#243748 52%,#124163 100%)}

  .num{font-family:var(--display);font-weight:700;font-size:clamp(84px,10vw,140px);line-height:.82;letter-spacing:-.04em;background:linear-gradient(160deg,#2683C6 0%,#57B6C0 60%,#76BDA7 100%);-webkit-background-clip:text;background-clip:text;color:transparent;width:fit-content}
  .copy h2{font-family:var(--display);font-weight:700;color:var(--ink);font-size:clamp(25px,2.6vw,34px);line-height:1.08;letter-spacing:-.01em;margin:16px 0 10px;max-width:15ch}
  .copy p{color:var(--ink-soft);max-width:34ch;font-size:15.5px}
  .where{margin-top:20px;display:inline-flex;gap:8px;align-items:flex-start;background:#fff;color:var(--deep);border:1px solid var(--mist);border-left:3px solid var(--ocean);padding:10px 13px;border-radius:8px;box-shadow:0 8px 20px -14px rgba(18,65,99,.35);font-size:13.5px;font-weight:600;max-width:36ch}
  .where svg{flex:none;margin-top:3px}

  /* ================= Outlook mock ================= */
  .ol{height:100%;max-height:450px;background:var(--ol-bg);border:1px solid #D6D6D6;border-radius:10px;display:flex;flex-direction:column;overflow:hidden;font-family:var(--ol-ui);font-size:12.5px;color:var(--ol-text);box-shadow:0 30px 60px -30px rgba(20,33,61,.45);line-height:1.45}
  .ol-tabs{display:flex;gap:18px;padding:7px 14px 3px;font-size:12px;flex:none}
  .ol-tabs span{padding-bottom:3px}
  .ol-tabs .on{font-weight:600;border-bottom:2px solid var(--ol-blue)}
  .ol-ribbon{display:flex;align-items:center;gap:8px;margin:4px 8px 7px;flex:none}
  .ol-tb{flex:1;min-width:0;height:32px;background:#fff;border-radius:8px;box-shadow:0 1px 2px rgba(0,0,0,.14);display:flex;align-items:center;gap:11px;padding:0 10px;overflow:hidden;color:#424242}
  .ol-tb svg{flex:none}
  .ol-tb .sep{width:1px;height:18px;background:#E0E0E0;flex:none}
  .ol-dd{flex:none;border:1px solid var(--ol-line);border-radius:4px;height:22px;display:flex;align-items:center;justify-content:space-between;padding:0 6px;font-size:12px;color:var(--ol-text);gap:8px}
  .ol-new{flex:none;background:var(--ol-blue);color:#fff;border-radius:4px;padding:3px 10px;font-weight:600;font-size:12px;display:flex;align-items:center;gap:6px}
  .ol-cp{flex:none;width:38px;height:32px;border-radius:8px;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.14);display:grid;place-items:center;position:relative}
  .ol-cp.wait{cursor:pointer;z-index:6}
  .ol-cp.wait:hover{background:#F5F7FA}
  .cp-hint{position:absolute;top:40px;right:0;white-space:nowrap;background:#1B1A23;color:#fff;font-family:var(--body);font-size:12px;font-weight:600;padding:6px 10px;border-radius:7px;box-shadow:0 8px 20px -8px rgba(0,0,0,.5);pointer-events:none;animation:hintIn .35s ease}
  .cp-hint::before{content:'';position:absolute;top:-5px;right:14px;width:10px;height:10px;background:#1B1A23;transform:rotate(45deg)}
  @keyframes hintIn{from{opacity:0;transform:translateY(-4px)}}
  .cplogo{display:block}
  .ol-list.gone + .ol-card{flex:1}
  .ol-main{flex:1;min-height:0;display:flex;gap:8px;padding:0 8px 8px;position:relative}
  .ol-card{flex:1;min-width:0;background:#fff;border:1px solid #E1E1E1;border-radius:8px;padding:10px 14px;position:relative;overflow:hidden}

  .send{display:inline-flex;border-radius:4px;overflow:hidden;position:relative}
  .send b{background:var(--ol-blue);color:#fff;padding:4px 12px;display:flex;align-items:center;gap:6px;font-weight:600}
  .send i{background:var(--ol-blue);border-left:1px solid rgba(255,255,255,.4);padding:4px 6px;display:flex;align-items:center}
  .ol-hr{border-bottom:1px solid #E6E6E6;margin:8px -14px 4px}
  .ol-field{display:flex;align-items:center;gap:10px;margin-top:7px}
  .ol-field .lbl{border:1px solid var(--ol-line);border-radius:4px;padding:2px 10px;font-weight:600;font-size:12px;flex:none}
  .ol-field .line{flex:1;min-height:25px;border-bottom:1px solid var(--ol-line);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .person{background:#EBF3FC;color:var(--ol-text);border-radius:999px;padding:1px 9px 1px 2px;font-size:12px;display:inline-flex;align-items:center;gap:5px}
  .person em{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:9px;font-weight:700;font-style:normal}
  .ol-subj{border-bottom:1px solid var(--ol-line);padding:10px 0 5px;min-height:34px}
  .ol-subj .ph{color:var(--ol-sub)}
  .ol-body{padding-top:10px;white-space:pre-wrap;font-size:13px}
  .err{text-decoration:underline wavy #C50F1F;text-decoration-thickness:1.2px;text-underline-offset:3px}
  .fix{background:var(--mint);border-radius:3px;padding:0 2px}

  /* Floating Copilot suggestions (like the real compose window) */
  .pills{position:absolute;right:10px;top:4px;display:flex;flex-direction:column;align-items:flex-end;gap:7px;z-index:3}
  .pill{background:#fff;border-radius:10px;box-shadow:0 2px 8px rgba(0,0,0,.16);padding:6px 12px;font-size:11.5px;position:relative}

  /* Inline "Help me write" box */
  .drafter{margin-top:10px;border-radius:10px;padding:1.5px;background:linear-gradient(90deg,#2683C6,#3394BA,#57B6C0,#76BDA7)}
  .drafter > div{background:#fff;border-radius:9px;padding:9px 11px}
  .drafter .row{display:flex;align-items:flex-start;gap:8px}
  .drafter .ptext{flex:1;min-height:36px;font-size:12.5px}
  .drafter .ph{color:var(--ol-sub)}
  .gen{flex:none;width:26px;height:26px;border-radius:6px;background:var(--ol-blue);display:grid;place-items:center;position:relative}
  .after{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:10px;padding-top:8px;border-top:1px solid #EEE}
  .btn-p{background:var(--ol-blue);color:#fff;border-radius:4px;padding:3px 12px;font-size:12px;font-weight:600;position:relative}
  .btn-s{border:1px solid var(--ol-line);border-radius:4px;padding:3px 10px;font-size:12px;background:#fff;position:relative}

  /* Copilot side pane (matches real layout) */
  .pane{width:47%;flex:none;background:#FAFAFA;border-radius:8px;border:1px solid #E6E6E6;padding:10px 12px;display:flex;flex-direction:column;gap:9px;overflow:hidden}
  .pane.wide{width:53%}
  .pane-head{display:flex;justify-content:space-between;align-items:center;font-weight:600;font-size:14px}
  .pane-head span:last-child{display:flex;gap:10px;color:#616161}
  .pane-tools{display:flex;justify-content:space-between;align-items:center;color:#616161}
  .pane-new{background:var(--ol-blue);border-radius:5px;width:42px;height:22px;display:flex;align-items:center;justify-content:center;gap:4px}
  .pane-hero{text-align:center;font-weight:700;font-size:16px;margin:10px 0 6px}
  .msgbox{background:#fff;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.14);padding:8px 12px 6px;flex:none}
  .msgbox .t{min-height:20px;font-size:12.5px}
  .msgbox .ph{color:var(--ol-sub)}
  .msgbox .r{display:flex;justify-content:space-between;color:#616161;margin-top:4px}
  .sugg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .sugg div{background:#fff;border:1px solid #E0E0E0;border-radius:10px;padding:9px;font-weight:600;font-size:12px;min-height:58px}
  .sugg svg{display:block;margin-bottom:5px}
  .ubub{align-self:flex-end;background:#E8EBFA;border-radius:10px;padding:7px 11px;font-size:12.5px;max-width:88%}
  .ans{background:#fff;border:1px solid #E6E6E6;border-radius:10px;padding:10px 12px;font-size:12.5px}
  .ans p{margin-bottom:6px}
  .ans .it{padding:6px 0;border-top:1px solid #F0F0F0;display:flex;gap:8px}
  .ans .it b{display:block}
  .ans .it span{color:var(--ol-sub);font-size:12px}
  .tag{flex:none;font-size:10.5px;font-weight:700;border-radius:4px;padding:1px 6px;height:fit-content;margin-top:2px}
  .tag.g{background:#FDE7E9;color:#A4262C}.tag.a{background:#FFF4CE;color:#7A5B00}.tag.i{background:#E8EBFA;color:#3B3FA0}
  .conv{display:flex;flex-direction:column;justify-content:flex-end;gap:8px;flex:1;min-height:0;overflow:hidden}
  .conv>*{flex-shrink:0}
  .fchips{display:flex;gap:6px;flex-wrap:wrap}
  .fchips button{background:#fff;border:1px solid #D6D6D6;border-radius:999px;padding:3px 10px;font-size:11.5px;position:relative}

  /* Mail reading view */
  .ol-list{width:31%;flex:none;background:#fff;border:1px solid #E1E1E1;border-radius:8px;overflow:hidden}
  .ol-list .h{padding:8px 10px;font-weight:600;font-size:13px;border-bottom:1px solid #F0F0F0;display:flex;gap:12px}
  .ol-list .h span:last-child{font-weight:400;color:var(--ol-sub)}
  .li{padding:7px 10px 7px 12px;border-bottom:1px solid #F3F3F3;border-left:3px solid transparent}
  .li.sel{background:#EBF3FC;border-left-color:var(--ol-blue)}
  .li b{display:block;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .li span{display:block;font-size:11.5px;color:var(--ol-sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .li .s{color:var(--ol-text)}
  .rd-subj{font-size:15px;font-weight:600;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:8px}
  .from{display:flex;gap:9px;align-items:center;margin:8px 0}
  .av{width:28px;height:28px;flex:none;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;color:#fff!important}
  .from b{display:block;font-size:12.5px}
  .from span{color:var(--ol-sub);font-size:11.5px}
  .sumbox{border:1px solid #E0E0E0;border-radius:8px;padding:8px 10px;background:#fff}
  .sumbox .sh{display:flex;justify-content:space-between;align-items:center;font-weight:600;font-size:12.5px}
  .sumbox .sh span{display:flex;gap:6px;align-items:center}
  .sumbtn{border:1px solid var(--ol-line);border-radius:4px;padding:2px 10px;font-size:12px;background:#fff;position:relative;font-weight:400}
  .sumbox ul{padding-left:18px;margin-top:6px;display:flex;flex-direction:column;gap:4px;font-size:12.5px}
  .cite{display:inline-block;font-size:10px;font-weight:700;background:#E8EBFA;color:#3B3FA0;border-radius:4px;padding:0 4px;margin-left:3px;vertical-align:1px}
  .shimmer{height:8px;border-radius:4px;margin:6px 0;background:linear-gradient(90deg,#EEF0F6 20%,#DDE2EE 50%,#EEF0F6 80%);background-size:200% 100%;animation:sh 1.2s linear infinite}
  @keyframes sh{to{background-position:-200% 0}}
  .menu{position:absolute;right:12px;top:40px;background:#fff;border-radius:8px;box-shadow:0 6px 18px rgba(0,0,0,.18);padding:4px;z-index:4;width:190px}
  .menu div{padding:6px 10px;border-radius:5px;display:flex;gap:8px;align-items:center;position:relative}
  .menu .hl{background:#F0F0F0}
  .event{position:absolute;inset:0;background:#fff;padding:10px 14px;transform:translateX(105%);transition:transform .6s cubic-bezier(.2,.8,.2,1);z-index:5}
  .event.show{transform:none}
  .event .etitle{font-size:15px;font-weight:600;border-bottom:2px solid var(--ol-blue);padding:4px 0;min-height:30px;margin:6px 0 4px}
  .free{background:#DFF6DD;color:#0E700E;border-radius:999px;padding:1px 9px;font-size:11.5px;font-weight:600}
  .icbtn{display:inline-flex;align-items:center;justify-content:center;width:26px;height:24px;border-radius:5px;position:relative}

  /* Reveal / tap states */
  .rv{opacity:0;transform:translateY(5px);transition:opacity .45s ease,transform .45s ease}
  .rv.show{opacity:1;transform:none}
  .gone{display:none!important}
  .tap::after{content:"";position:absolute;inset:-4px;border-radius:10px;border:2px solid var(--accent);animation:ring 1.1s ease-out infinite;pointer-events:none}
  @keyframes ring{from{opacity:.9;transform:scale(.95)}to{opacity:0;transform:scale(1.14)}}
  .pressed{animation:press .35s ease}
  @keyframes press{50%{transform:scale(.92)}}
  .caret{display:inline-block;width:1.5px;height:14px;background:var(--ol-text);vertical-align:-2px;animation:blink 1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}

  /* Intro + outro */
  .intro .kicker{font-weight:600;color:#84ACB6;font-size:15px;margin-bottom:16px;display:flex;align-items:center;gap:10px}
  .intro .kicker::before{content:'';width:28px;height:2px;background:var(--grad)}
  .intro h1{font-family:var(--display);font-weight:700;font-size:clamp(40px,5.8vw,74px);line-height:.98;letter-spacing:-.025em;max-width:14ch;color:#fff}
  .intro h1 .five{display:inline-block;background:linear-gradient(140deg,#57B6C0,#76BDA7);-webkit-background-clip:text;background-clip:text;color:transparent}
  .intro p{color:#CDDBE6;font-size:18px;margin:20px 0 28px;max-width:48ch}
  .start{background:var(--grad);color:#fff;font-weight:600;padding:14px 24px;border-radius:10px;box-shadow:0 14px 30px -12px rgba(38,131,198,.7);display:inline-flex;align-items:center;gap:10px;font-size:16px}
  .start:hover{filter:brightness(1.08)}
  .intro-strip{display:flex;gap:8px;margin-top:34px;flex-wrap:wrap}
  .intro-strip span{border:1px solid rgba(205,219,230,.28);background:rgba(255,255,255,.05);border-radius:999px;padding:6px 13px;font-size:13px;color:#CDDBE6}
  .outro{display:grid!important;grid-template-columns:1.1fr 1fr;gap:34px;align-items:start;overflow:auto;max-height:100%;width:100%}
  .outro h2{font-family:var(--display);font-weight:700;color:var(--ink);font-size:clamp(30px,3.3vw,42px);letter-spacing:-.02em;line-height:1;margin-bottom:14px}
  .try{display:flex;gap:14px;padding:10px 0;border-top:1px solid var(--line)}
  .try .n{font-family:var(--display);font-weight:700;font-size:26px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;width:20px;line-height:1;flex:none}
  .try b{display:block;font-size:15px}
  .try q{display:block;color:var(--ink-soft);font-size:14px;quotes:"\201C" "\201D"}
  .copy-btn{margin-left:auto;align-self:center;flex:none;font-size:12.5px;font-weight:600;color:var(--deep);border:1px solid var(--mist);background:#fff;border-radius:8px;padding:5px 10px}
  .quiz{background:#fff;border:1px solid var(--mist);border-top:3px solid transparent;border-image:none;border-radius:14px;padding:20px 22px;box-shadow:0 20px 40px -28px rgba(18,65,99,.45);position:relative;overflow:hidden}
  .quiz::before{content:'';position:absolute;left:0;right:0;top:0;height:4px;background:var(--grad)}
  .quiz h3{font-family:var(--display);font-size:22px;margin-bottom:4px}
  .quiz > p{font-size:14px;color:var(--ink-soft)}
  .qq{margin-top:11px}
  .qq > b{display:block;font-size:14px;line-height:1.35;margin-bottom:6px}
  .opts{display:flex;flex-direction:column;gap:5px}
  .opts button{text-align:left;background:#fff;border:1px solid var(--line);border-radius:8px;padding:6px 11px;font-size:13.5px}
  .opts button:hover:not(:disabled){border-color:var(--accent)}
  .opts button.right{background:#E3F1ED;border-color:#76BDA7}
  .opts button.wrong{background:#FDE3E3;border-color:#F0A3A3}
  .opts button:disabled{cursor:default}
  .qfb{font-size:13px;margin-top:6px;color:var(--ink-soft)}
  .again{margin-top:18px;font-weight:600;color:#fff;border-radius:10px;padding:10px 18px;background:var(--grad)}
  .note{font-size:12.5px;color:var(--ink-soft);margin-top:12px}

  .caption{min-height:62px;padding:14px 26px;font-size:17px;font-weight:400;display:flex;align-items:center;background:#1B1A23;color:#fff;letter-spacing:.005em}
  .caption span{max-width:72ch}
  .controls{display:flex;align-items:center;gap:14px;padding:12px 26px 16px;background:#1B1A23;border-top:1px solid rgba(255,255,255,.07)}
  .cbtn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;border:1px solid rgba(205,219,230,.2);background:rgba(255,255,255,.05);color:#fff;flex:none}
  .cbtn:hover:not(:disabled){background:rgba(255,255,255,.12)}
  .cbtn.play{background:var(--grad);border:none;width:48px;height:48px;box-shadow:0 8px 20px -8px rgba(87,182,192,.7)}
  .cbtn:disabled{opacity:.35;cursor:default}
  .segs{flex:1;display:flex;gap:6px}
  .seg{flex:1;display:flex;flex-direction:column;gap:7px;text-align:left;font-size:12px;color:#84ACB6;min-width:0}
  .seg .bar{display:block;height:5px;border-radius:3px;background:rgba(205,219,230,.16);overflow:hidden}
  .seg .fill{display:block;height:100%;width:0;background:var(--grad)}
  .seg .lbl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .seg.cur .lbl{color:#fff;font-weight:600}
  .narr{font-size:13px;font-weight:600;border:1px solid rgba(205,219,230,.25);border-radius:999px;padding:7px 14px;color:#CDDBE6;flex:none;display:flex;align-items:center;gap:7px}
  .narr[aria-pressed="true"]{background:rgba(87,182,192,.16);border-color:#57B6C0;color:#fff}
  .voice{flex:none;max-width:190px;font:inherit;font-size:12.5px;color:#CDDBE6;background:#243748;border:1px solid rgba(205,219,230,.25);border-radius:8px;padding:6px 8px}
  .voice[hidden]{display:none}

  @media (max-width:900px){
    body{padding:0;align-items:stretch}
    .player{border-radius:0;border:none;min-height:100%}
    .stage{aspect-ratio:auto;min-height:0}
    .scene{position:relative;inset:auto;grid-template-columns:1fr;gap:16px;padding:20px 14px}
    .scene:not(.active){display:none!important}
    .num{font-size:64px}
    .copy h2{max-width:none}
    .ol{height:430px}
    .ol-list{display:none}
    .pane{width:56%}
    .outro{grid-template-columns:1fr}
    .seg .lbl{display:none}
    .caption{font-size:15px;padding:12px 16px}
    .voice{max-width:110px}
    .controls{flex-wrap:wrap}
    .controls{padding:10px 16px 14px;gap:10px}
  }
  @media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>

const list = (items, id='') => `<div class="ol-list" ${id?`id="${id}"`:''}><div class="h"><span>Focused</span><span>Other</span></div>${items.map(([n,s,p,sel])=>`<div class="li ${sel?'sel':''}"><b>${n}</b><span class="s">${s}</span><span>${p}</span></div>`).join('')}</div>`;

/* ---------- Cue helpers ---------- */
const $ = s => document.querySelector(s);
const show = id => () => $('#'+id)?.classList.add('show');
const gone = id => () => $('#'+id)?.classList.add('gone');
const unhide = id => () => $('#'+id)?.classList.remove('gone');
const tap = id => () => $('#'+id)?.classList.add('tap');
const press = id => () => { const el=$('#'+id); if(!el) return; el.classList.remove('tap'); el.classList.add('pressed'); setTimeout(()=>el.classList.remove('pressed'),400); };
const all = (...f) => () => f.forEach(x=>x());
// Pause until the viewer clicks the Copilot icon themselves
let waitingFor = null;
const waitClick = id => () => {
  const el = $('#'+id); if (!el) return;
  waitingFor = id;
  el.classList.add('tap','wait');
  const hint = document.createElement('span'); hint.className = 'cp-hint'; hint.textContent = 'Click to open Copilot';
  el.appendChild(hint);
  el.onclick = () => resumeFromClick(el);
};
function resumeFromClick(el){
  if (!waitingFor) return;
  waitingFor = null;
  el.querySelector('.cp-hint')?.remove();
  el.classList.remove('wait'); press(el.id)();
  el.onclick = null;
  if (!playing) setPlaying(true);
}

/* ---------- Player engine ---------- */
const stage = $('#stage'), capEl = $('#caption'), playBtn = $('#play'), segsEl = $('#segs');
const tips = scenes.filter(s => s.num);
let idx = 0, elapsed = 0, playing = false, last = performance.now(), cueI = 0, curCap = '', narrate = false;

tips.forEach(s => {
  const b = document.createElement('button');
  b.className = 'seg'; b.dataset.id = s.id;
  b.setAttribute('aria-label', `Tip ${s.num}: ${s.title}`);
  b.innerHTML = `<span class="bar"><span class="fill"></span></span><span class="lbl">${s.num}. ${s.short}</span>`;
  b.onclick = () => { load(scenes.indexOf(s)); setPlaying(true); };
  segsEl.appendChild(b);
});

function load(i){
  idx = Math.max(0, Math.min(scenes.length-1, i));
  const s = scenes[idx];
  elapsed = 0; cueI = 0; curCap = ''; waitingFor = null;
  stopVoice();
  setupClip(s);
  stage.innerHTML = s.full
    ? `<div class="scene full active ${s.dark?'dark':''}">${s.html}</div>`
    : `<div class="scene active"><div class="copy"><div class="num" aria-hidden="true">${s.num}</div>
         <h2>${s.title}</h2><p>${s.how}</p><div class="where">${I.pin}<span>${s.where}</span></div></div>${s.html()}</div>`;
  $('#counter').textContent = s.num ? `${s.num} of ${tips.length}` : (s.id==='intro' ? 'About 2 minutes' : 'Recap');
  $('#prev').disabled = idx === 0;
  $('#next').disabled = idx === scenes.length-1;
  if (s.full) setCaption(s.caption);
  if (s.id === 'intro') $('#startBtn').onclick = () => { load(1); setPlaying(true); };
  if (s.id === 'outro') { setPlaying(false); buildOutro(); }
  updateSegs();
}

function setPlaying(p){
  if (scenes[idx].full && p) load(1);
  playing = p;
  playBtn.setAttribute('aria-label', p ? 'Pause' : 'Play');
  $('#playIcon').innerHTML = p ? '<path d="M3 2h4v12H3zM9 2h4v12H9z"/>' : '<path d="M4 2v12l10-6z"/>';
  if (clip) { if (p && narrate) clip.play().catch(()=>{}); else clip.pause(); }
  else if (window.speechSynthesis) p ? speechSynthesis.resume() : speechSynthesis.pause();
}

/* ---------- Narration ---------- */
let voices = [], voice = null, speaking = false, speakTimer = null, clip = null, clipDone = true;
let voiceLocked = false;

// Rank voices so the most natural-sounding one available is chosen first.
function voiceScore(v){
  const n = v.name, en = /^en(-|_|$)/i.test(v.lang);
  if (!en) return -1;
  let sc = 0;
  if (/natural/i.test(n)) sc += 100;                                  // Edge / Windows neural voices
  if (/online/i.test(n)) sc += 20;
  if (/(Ava|Andrew|Emma|Brian|Jenny|Aria|Guy|Michelle|Steffan|Sonia|Ryan|Libby|Natasha|William)/.test(n)) sc += 30;
  if (/premium|enhanced|neural/i.test(n)) sc += 60;                   // Apple premium / enhanced
  if (/^Google (US|UK) English/i.test(n)) sc += 45;                   // Chrome cloud voices
  if (/(Samantha|Allison|Susan|Karen|Daniel|Serena|Moira|Tessa)/.test(n)) sc += 25;
  if (/en-US/i.test(v.lang)) sc += 5;
  if (/(espeak|robot|Fred|Albert|Zarvox|Trinoids|Bad News|Bells|Cellos|Whisper|Junior)/i.test(n)) sc -= 200;
  return sc;
}
function loadVoices(){
  if (!window.speechSynthesis) return;
  voices = speechSynthesis.getVoices().filter(v => voiceScore(v) >= 0).sort((a,b) => voiceScore(b) - voiceScore(a));
  if (!voices.length) return;
  if (!voiceLocked) voice = voices[0];
}
if (window.speechSynthesis) { loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }

function stopVoice(){
  speaking = false; clearTimeout(speakTimer);
  if (window.speechSynthesis) speechSynthesis.cancel();
  if (clip) { clip.pause(); clip = null; }
}
function setupClip(s){
  clipDone = true;
  if (!AUDIO[s.id]) return;
  clip = new Audio(AUDIO[s.id]); clipDone = false;
  clip.onended = () => { clipDone = true; };
  clip.onerror = () => { clip = null; clipDone = true; };   // file missing: fall back to browser voice
  if (narrate && (playing || s.full)) clip.play().catch(()=>{});
}
function speak(t){
  if (!window.speechSynthesis) return;
  if (!voiceLocked) { loadVoices(); voiceLocked = !!voice; }   // pick the best voice once, then keep it
  if (!voice) return;
  speechSynthesis.cancel(); speechSynthesis.resume();
  const u = new SpeechSynthesisUtterance(t);
  u.voice = voice; u.lang = voice.lang;
  u.rate = /natural|premium|enhanced|Google/i.test(voice.name) ? 1 : 0.94;   // slightly slower for basic voices
  u.pitch = 1;
  speaking = true;
  const done = () => { speaking = false; clearTimeout(speakTimer); };
  u.onend = done; u.onerror = done;
  // Safety net in case a browser never reports the end of speech
  speakTimer = setTimeout(done, t.split(/\s+/).length * 480 + 2500);
  setTimeout(() => speechSynthesis.speak(u), 60);
}
function setCaption(t){
  if (t === curCap) return;
  curCap = t; capEl.textContent = t;
  if (narrate && !clip) speak(t);
}
// While the narrator is mid-sentence, hold the animation at the next caption
// so lines are never cut off.
function holdFor(s, next){
  if (!narrate) return next;
  if (clip) {
    return (!clipDone && next >= s.dur) ? s.dur - 1 : next;
  }
  if (!speaking) return next;
  const upcoming = s.caps.map(c => c[0]).filter(t => t > elapsed).concat([s.dur])[0];
  return next >= upcoming ? Math.max(elapsed, upcoming - 1) : next;
}

function updateSegs(){
  segsEl.querySelectorAll('.seg').forEach(b => {
    const t = scenes.find(x => x.id === b.dataset.id), ti = scenes.indexOf(t);
    b.querySelector('.fill').style.width = (ti < idx ? 100 : ti > idx ? 0 : Math.min(100, elapsed / t.dur * 100)) + '%';
    b.classList.toggle('cur', ti === idx);
  });
}

function tick(now){
  const dt = Math.min(100, now - last); last = now;
  const s = scenes[idx];
  if (playing && !s.full) {
    if (!waitingFor) elapsed = holdFor(s, elapsed + dt);
    while (s.cues && cueI < s.cues.length && s.cues[cueI][0] <= elapsed) { s.cues[cueI][1](); cueI++; }
    (s.types||[]).forEach(([t, d, id, text]) => {
      if (elapsed < t || elapsed > t + d + 300) return;
      const el = document.getElementById(id); if (!el) return;
      const n = Math.round(Math.min(1, (elapsed - t) / d) * text.length);
      if (el.textContent.length !== n) el.textContent = text.slice(0, n);
    });
    const c = [...s.caps].reverse().find(([t]) => t <= elapsed);
    if (c) setCaption(c[1]);
    updateSegs();
    if (elapsed >= s.dur) load(idx + 1);
  }
  requestAnimationFrame(tick);
}

function buildOutro(){
  const q = $('#quiz');
  q.innerHTML = quiz.map((item, qi) => `<div class="qq"><b>${item.q}</b><div class="opts">
      ${item.o.map((o, oi) => `<button data-q="${qi}" data-o="${oi}">${o}</button>`).join('')}
    </div><div class="qfb" id="qfb${qi}"></div></div>`).join('');
  q.querySelectorAll('.opts button').forEach(b => b.onclick = () => {
    const item = quiz[b.dataset.q], ok = +b.dataset.o === item.a;
    b.parentElement.querySelectorAll('button').forEach((x, i) => { x.disabled = true; if (i === item.a) x.classList.add('right'); });
    if (!ok) b.classList.add('wrong');
    $('#qfb'+b.dataset.q).textContent = (ok ? 'Correct. ' : 'Not quite. ') + item.why;
  });
  document.querySelectorAll('.copy-btn').forEach(b => b.onclick = () => {
    const txt = b.parentElement.querySelector('q').textContent;
    const done = () => { b.textContent = 'Copied'; setTimeout(() => b.textContent = 'Copy', 1600); };
    if (navigator.clipboard) navigator.clipboard.writeText(txt).then(done, () => fallbackCopy(txt, done));
    else fallbackCopy(txt, done);
  });
  $('#againBtn').onclick = () => { load(1); setPlaying(true); };
}
function fallbackCopy(txt, done){
  const t = document.createElement('textarea'); t.value = txt; document.body.appendChild(t);
  t.select(); try { document.execCommand('copy'); done(); } catch(e){} t.remove();
}

playBtn.onclick = () => setPlaying(!playing);
$('#prev').onclick = () => load(idx - 1);
$('#next').onclick = () => load(idx + 1);
$('#narr').onclick = e => {
  narrate = !narrate;
  const b = e.currentTarget;
  b.setAttribute('aria-pressed', narrate);
  b.querySelector('span').textContent = narrate ? 'Narration on' : 'Narration off';
  if (!narrate) { speaking = false; if (window.speechSynthesis) speechSynthesis.cancel(); if (clip) clip.pause(); }
  else if (clip) { if (playing || scenes[idx].full) clip.play().catch(()=>{}); }
  else { loadVoices(); const c = curCap; curCap = ''; setCaption(c); }
};
document.addEventListener('keydown', e => {
  if (e.target.closest('button') && (e.key === ' ' || e.key === 'Enter')) return;
  if (e.key === 'Enter' && waitingFor) { resumeFromClick($('#'+waitingFor)); return; }
  if (e.key === ' ') { e.preventDefault(); setPlaying(!playing); }
  if (e.key === 'ArrowRight') load(idx + 1);
  if (e.key === 'ArrowLeft') load(idx - 1);
});

load(0);
requestAnimationFrame(tick);
</script>
</body>
</html>
